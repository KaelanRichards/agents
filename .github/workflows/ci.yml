name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v3
        with:
          install: false

      - name: Validate mise tool resolution
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/home/dot_config/mise/config.toml
        run: mise install --dry-run --locked

      - name: Validate JSON
        run: |
          mise exec jq@1.8.2 -- jq -e . home/dot_config/zed/settings.json
          mise exec jq@1.8.2 -- jq -e . .devcontainer/devcontainer.json

      - name: Validate workflow
        run: mise exec actionlint@1.7.12 -- actionlint

  render:
    name: render dotfiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v3
        with:
          install: false

      - name: Install chezmoi
        run: mise install chezmoi@2.70.5

      - name: Resolve platform toolchain
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/home/dot_config/mise/config.toml
        run: mise install --dry-run --locked

      - name: Dry-run apply
        shell: bash
        run: |
          destination="$RUNNER_TEMP/chezmoi-home"
          mkdir -p "$destination"
          mise exec chezmoi@2.70.5 -- chezmoi \
            --source "$GITHUB_WORKSPACE" \
            --destination "$destination" \
            apply --dry-run --no-tty
